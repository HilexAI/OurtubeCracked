name: 01 - 🎯 دانلود یوتیوب

on:
  workflow_dispatch:
    inputs:
      activation_key:
        description: '🔑 کدفعالسازی (یکبار در ابتدا ) اگر ندارید از اینجا بگیرید : https://raw.githubusercontent.com/amirhilex/OurtubeCracked/refs/heads/main/key.txt'
        required: false
        default: ''
        type: string
      video_urls:
        description: '🔗 لینک ویدیو ( چند لینک با فاصله )'
        required: true
        type: string
      quality:
        description: '🎬 کیفیت و نوع'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      password:
        description: '🔒 رمز ( اختیاری برای محافظت )'
        required: false
        default: ''
        type: string

jobs:
  check-activation:
    name: "🔍 بررسی فعالسازی"
    runs-on: ubuntu-latest
    outputs:
      is_activated: ${{ steps.check.outputs.is_activated }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore activation cache
        id: cache-activation
        uses: actions/cache@v5
        with:
          path: .activation-status
          key: activation-status-yt-${{ github.repository }}

      - name: Check activation status
        id: check
        run: |
          echo "========================================"
          echo "🔍 بررسی وضعیت فعالسازی..."
          echo "========================================"
          if [ -f ".activation-status/act.txt" ]; then
            ACT_STATUS=$(cat .activation-status/act.txt 2>/dev/null || echo "")
            if [ "$ACT_STATUS" = "1" ]; then
              echo "is_activated=true" >> $GITHUB_OUTPUT
              echo "✅ وضعیت: فعال شده"
              echo "🎉 دانلودر شما فعال است!"
            else
              echo "is_activated=false" >> $GITHUB_OUTPUT
              echo "🔒 وضعیت: فعال نشده"
            fi
          else
            echo "is_activated=false" >> $GITHUB_OUTPUT
            echo "🔒 وضعیت: فعال نشده"
            echo "⚠️ برای استفاده از دانلودر، ابتدا باید آن را فعال کنید"
          fi
          echo "========================================"

  activate:
    name: "🔐 فعالسازی با کد"
    needs: check-activation
    if: needs.check-activation.outputs.is_activated == 'false' && github.event.inputs.activation_key != ''
    runs-on: ubuntu-latest
    outputs:
      just_activated: ${{ steps.validate.outputs.valid }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch and validate activation code
        id: validate
        run: |
          INPUT_CODE="${{ github.event.inputs.activation_key }}"
          KEYS_URL="https://raw.githubusercontent.com/amirhilex/OurtubeCracked/refs/heads/main/key.txt"

          echo "========================================"
          echo "🔐 در حال بررسی کد فعالسازی..."
          echo "========================================"
          echo ""
          echo "📥 دریافت لیست کدهای معتبر..."
          curl -sL "$KEYS_URL" | tr -d '\r' | grep -v '^$' > /tmp/raw_codes.txt

          # Extract last 4 characters of each valid code
          > /tmp/valid_codes.txt
          while IFS= read -r code; do
            code=$(echo "$code" | tr -d '[:space:]')
            [ -z "$code" ] && continue
            if [ ${#code} -gt 4 ]; then
              echo "${code: -4}" >> /tmp/valid_codes.txt
            else
              echo "$code" >> /tmp/valid_codes.txt
            fi
          done < /tmp/raw_codes.txt

          # Extract last 4 characters of user's input code
          if [ ${#INPUT_CODE} -gt 4 ]; then
            INPUT_CODE_LAST4="${INPUT_CODE: -4}"
          else
            INPUT_CODE_LAST4="$INPUT_CODE"
          fi

          echo "🔍 بررسی کد..."

          if grep -qx "$INPUT_CODE_LAST4" /tmp/valid_codes.txt; then
            echo ""
            echo "✅ کد فعالسازی معتبر است!"
            echo "🎊 تبریک! کد شما تایید شد"
            echo ""
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo ""
            echo "❌ کد فعالسازی نامعتبر است!"
            echo ""
            echo "⚠️ این کد در لیست کدهای معتبر وجود ندارد"
            echo "💡 لطفاً کد صحیح را وارد کنید یا کد جدید خریداری کنید"
            echo ""
            echo ""
            echo "valid=false" >> $GITHUB_OUTPUT
          fi
          echo "========================================"

      - name: Fail on invalid code
        if: steps.validate.outputs.valid != 'true'
        run: |
          echo ""
          echo "❌ فعالسازی ناموفق بود"
          echo ""
          echo "🔴 کد وارد شده معتبر نیست"
          echo ""
          echo "📌 کلید فعالسازی معتبر وارد کنید."
          echo ""

          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          <div align="center">
          # خطا در فعالسازی
          </div>

          ---

          <div dir="rtl">

          شما کلید فعالساز وارد نکرده یا کلید وارد شده اشتباه است به همین علت امکان استفاده از این پروژه برای شما وجود ندارد.

          برای خرید کلید فعالسازی به لینک پایین مراجعه کنید.

          **نکات :**
          - کلید دائمی است.
          - وارد کردن کلید فعالسازی فقط یکبار کافی است. دفعات بعدی نیاز نیست.
          - در صورت بروز هرگونه مشکل در پیام رسان بله به ایدی @ask_here پیام دهید.

          **راهنما:**

          یک کلید فعالسازی معتبر وارد کنید.

          </div>
          EOF

          exit 1

      - name: Save activation to cache
        if: steps.validate.outputs.valid == 'true'
        run: |
          echo "💾 در حال ذخیره وضعیت فعالسازی در کش..."
          mkdir -p .activation-status
          echo "1" > .activation-status/act.txt
          echo "activated_at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> .activation-status/info.txt
          echo "activated_by=${{ github.actor }}" >> .activation-status/info.txt
          echo "✅ فعالسازی ذخیره شد"

      - name: Cache activation status
        if: steps.validate.outputs.valid == 'true'
        uses: actions/cache/save@v5
        with:
          path: .activation-status
          key: activation-status-yt-${{ github.repository }}

      - name: Activation success message
        if: steps.validate.outputs.valid == 'true'
        run: |
          echo ""
          echo "========================================"
          echo "🎉 فعالسازی با موفقیت انجام شد!"
          echo "========================================"
          echo ""
          echo "✅ دانلودر شما اکنون فعال است"
          echo "📥 در حال ادامه دانلود..."
          echo ""
          echo "========================================"

  not-activated:
    name: "⚠️ نیاز به فعالسازی"
    needs: check-activation
    if: needs.check-activation.outputs.is_activated == 'false' && github.event.inputs.activation_key == ''
    runs-on: ubuntu-latest
    steps:
      - name: Show activation required
        run: |
          echo ""
          echo "========================================"
          echo "🔒 فعالسازی مورد نیاز است"
          echo "========================================"
          echo ""
          echo "⚠️ این دانلودر هنوز فعال نشده است"
          echo ""
          echo "📌 برای فعالسازی:"
          echo "   کد فعالسازی معتبر را در فیلد 'کد فعالسازی' وارد کنید"
          echo ""
          echo "========================================"

          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          <div align="center">
          # خطا در فعالسازی
          </div>

          ---

          <div dir="rtl">

          شما کلید فعالساز وارد نکرده یا کلید وارد شده اشتباه است به همین علت امکان استفاده از این پروژه برای شما وجود ندارد.

          برای خرید کلید فعالسازی به لینک پایین مراجعه کنید.

          **نکات :**
          - کلید دائمی است.
          - وارد کردن کلید فعالسازی فقط یکبار کافی است. دفعات بعدی نیاز نیست.
          - در صورت بروز هرگونه مشکل در پیام رسان بله به ایدی @ask_here پیام دهید.

          **راهنما:**

          یک کلید فعالسازی معتبر وارد کنید.

          </div>
          EOF

          exit 1

  get-video:
    name: "📥 دانلود ویدیو"
    needs: [check-activation, activate]
    if: always() && !cancelled() && (needs.check-activation.outputs.is_activated == 'true' || needs.activate.outputs.just_activated == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Check URL provided
        run: |
          if [ -z "${{ github.event.inputs.video_urls }}" ]; then
            echo "❌ No video URL provided!"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          echo "Git configured for large file handling"

      - name: Start WARP Container
        run: |
          echo "Starting Cloudflare WARP container..."
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp
          echo "Waiting for WARP to initialize (15 seconds)..."
          sleep 15
          echo "Checking WARP status..."
          for i in {1..5}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP is active!"
              echo "$RESULT"
              break
            else
              echo "Attempt $i/5 - WARP not ready yet, waiting..."
              sleep 5
            fi
          done
          FINAL=$(curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
          if echo "$FINAL" | grep -qE "warp=(on|plus)"; then
            echo "WARP proxy is ready!"
          else
            echo "WARP might not be fully active, but continuing anyway..."
            echo "Response: $FINAL"
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip p7zip-full curl jq bc unzip
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> "$GITHUB_PATH"

          node --version
          npm --version
          deno --version

          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade --pre "yt-dlp[default]"
          python3 -m pip install --upgrade "bgutil-ytdlp-pot-provider==1.3.1"

      - name: Install and build PO Token Provider
        run: |
          set -euo pipefail

          PROVIDER_DIR="$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          git clone --depth 1 --single-branch --branch 1.3.1             https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git             "$PROVIDER_DIR"

          cd "$PROVIDER_DIR/server"
          npm ci
          npx tsc

          test -f build/main.js
          echo "PO Token provider built successfully."

      - name: Start PO Token Provider
        env:
          HTTP_PROXY: socks5://127.0.0.1:1080
          HTTPS_PROXY: socks5://127.0.0.1:1080
          ALL_PROXY: socks5://127.0.0.1:1080
          NO_PROXY: 127.0.0.1,localhost,::1
        run: |
          set -euo pipefail

          PROVIDER_DIR="$RUNNER_TEMP/bgutil-ytdlp-pot-provider"
          nohup node "$PROVIDER_DIR/server/build/main.js"             > "$RUNNER_TEMP/bgutil-provider.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/bgutil-provider.pid"

          for i in {1..30}; do
            if curl --noproxy '*' -fsS --max-time 3 http://127.0.0.1:4416/ping > "$RUNNER_TEMP/bgutil-ping.json"; then
              echo "✅ PO Token Provider is ready"
              cat "$RUNNER_TEMP/bgutil-ping.json"
              exit 0
            fi
            sleep 1
          done

          echo "❌ PO Token Provider failed to start"
          cat "$RUNNER_TEMP/bgutil-provider.log" || true
          exit 1

      - name: Verify yt-dlp PO Token integration
        run: |
          set -euo pipefail

          echo "Checking yt-dlp version..."
          yt-dlp --version

          echo "Checking installed PO Token provider..."
          yt-dlp --verbose --simulate \
            --ignore-config \
            --extractor-args "youtube:player_client=mweb;youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
            "https://www.youtube.com/watch?v=BaW_jenozKc" \
            2>&1 | tee "$RUNNER_TEMP/ytdlp-pot-check.log" || true

          if grep -qE '\[youtube\] \[pot\] PO Token Providers:.*bgutil:http-[0-9]+\.[0-9]+\.[0-9]+' "$RUNNER_TEMP/ytdlp-pot-check.log"; then
            echo "✅ yt-dlp detected bgutil HTTP PO Token provider."
          else
            echo "❌ yt-dlp did not detect bgutil HTTP PO Token provider."
            cat "$RUNNER_TEMP/ytdlp-pot-check.log"
            exit 1
          fi

      - name: Download YouTube Video(s)
        env:
          YT_URLS: ${{ github.event.inputs.video_urls }}
          YT_QUALITY: ${{ github.event.inputs.quality }}
          YT_PASSWORD: ${{ github.event.inputs.password }}
          REPO_OWNER_ENV: ${{ github.repository_owner }}
          REPO_NAME_ENV: ${{ github.event.repository.name }}
          BRANCH_ENV: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          REPO_OWNER="$REPO_OWNER_ENV"
          REPO_NAME="$REPO_NAME_ENV"
          BRANCH="$BRANCH_ENV"
          QUALITY="$YT_QUALITY"
          ZIP_PASSWORD="$YT_PASSWORD"
          SPLIT_MB=45
          SPLIT_BYTES=$((SPLIT_MB * 1024 * 1024))
          BACKUP_DIR="/tmp/video_backup_$$"
          mkdir -p "$BACKUP_DIR" videos

          read -r -a URL_LIST <<< "$YT_URLS"
          TOTAL_URLS=${#URL_LIST[@]}
          : > /tmp/video_info.txt

          echo "Total URLs to download: $TOTAL_URLS"
          echo "Quality: $QUALITY"

          urlencode() {
            python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"
          }

          sanitize_name() {
            echo "$1" | sed 's/[[:space:]]\+/-/g; s/　/-/g' | tr -s '-'
          }

          case "$QUALITY" in
            best)
              FORMAT='bestvideo+bestaudio/best'
              ;;
            audio)
              FORMAT='bestaudio'
              ;;
            2160|4k)
              FORMAT='bestvideo[height=2160]+bestaudio/best[height=2160]'
              ;;
            1440|2k)
              FORMAT='bestvideo[height=1440]+bestaudio/best[height=1440]'
              ;;
            1080)
              FORMAT='bestvideo[height=1080]+bestaudio/best[height=1080]'
              ;;
            720)
              FORMAT='bestvideo[height=720]+bestaudio/best[height=720]'
              ;;
            480)
              FORMAT='bestvideo[height=480]+bestaudio/best[height=480]'
              ;;
            *)
              echo "❌ Unsupported quality: $QUALITY"
              exit 1
              ;;
          esac

          POT_ARGS='youtube:player_client=mweb;youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416'

          has_media_output() {
            local dir="$1"
            local file
            for file in "$dir"/*.mp4 "$dir"/*.webm "$dir"/*.mkv "$dir"/*.mp3; do
              [ -f "$file" ] && return 0
            done
            return 1
          }

          cleanup_download_dir() {
            local dir="$1"
            rm -f "$dir"/*.mp4 "$dir"/*.webm "$dir"/*.mkv "$dir"/*.mp3 \
                  "$dir"/*.part "$dir"/*.ytdl "$dir"/*.jpg "$dir"/*.webp 2>/dev/null || true
          }

          verify_download_quality() {
            local dir="$1"
            local target="$2"
            local file actual found=false

            if [ "$target" = "best" ] || [ "$target" = "audio" ]; then
              return 0
            fi

            for file in "$dir"/*.mp4 "$dir"/*.webm "$dir"/*.mkv; do
              [ -f "$file" ] || continue
              found=true

              actual=$(ffprobe -v error -select_streams v:0 \
                -show_entries stream=height -of csv=p=0 "$file" 2>/dev/null | head -n1 || true)

              if [[ "$actual" =~ ^[0-9]+$ ]] && [ "$actual" -eq "$target" ]; then
                echo "✅ Verified video height: ${actual}p (requested ${target}p)"
                return 0
              fi

              echo "⚠️ Rejecting $(basename "$file"): height=${actual:-unknown}, requested=${target}p"
            done

            [ "$found" = true ] || echo "❌ No video file produced."
            return 1
          }

          download_video() {
            local method="$1"
            local url="$2"
            local dir="$3"
            local -a args

            cleanup_download_dir "$dir"

            args=(
              --format "$FORMAT"
              --output "$dir/%(title)s.%(ext)s"
              --no-part
              --no-playlist
              --no-cache-dir
              --retries 5
              --fragment-retries 5
              --no-check-certificates
              --concurrent-fragments 8
              --buffer-size 16K
              --http-chunk-size 10M
              --progress
              --newline
            )

            if [ "$QUALITY" = "audio" ]; then
              args+=(--extract-audio --audio-format mp3 --audio-quality 0 --write-thumbnail --convert-thumbnails jpg)
            else
              args+=(--merge-output-format mp4 --write-thumbnail --convert-thumbnails jpg)
            fi

            case "$method" in
              1)
                args+=(--proxy socks5://127.0.0.1:1080 --extractor-args "$POT_ARGS" --js-runtimes deno --remote-components ejs:github)
                ;;
              2)
                args+=(--proxy socks5://127.0.0.1:1080 --extractor-args "$POT_ARGS" --js-runtimes deno --remote-components ejs:npm)
                ;;
              3)
                args+=(--proxy socks5://127.0.0.1:1080 --extractor-args "$POT_ARGS")
                ;;
              4)
                args+=(--proxy socks5://127.0.0.1:1080 --extractor-args 'youtube:player_client=web' --js-runtimes deno --remote-components ejs:github)
                ;;
              5)
                args+=(--proxy socks5://127.0.0.1:1080 --extractor-args 'youtube:player_client=web' --js-runtimes deno --remote-components ejs:npm)
                ;;
              6)
                args+=(--proxy socks5://127.0.0.1:1080 --extractor-args 'youtube:player_client=web')
                ;;
              7)
                args+=(--extractor-args "$POT_ARGS")
                ;;
              8)
                args+=(--extractor-args 'youtube:player_client=android' --user-agent 'Mozilla/5.0 (Linux; Android 12; SM-S906N Build/QP1A.190711.020) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Mobile Safari/537.36')
                ;;
              *)
                return 2
                ;;
            esac

            echo "Trying download method $method..."
            yt-dlp "${args[@]}" "$url"

            if has_media_output "$dir"; then
              return 0
            fi

            echo "❌ yt-dlp produced no media output."
            return 1
          }

          normalize_youtube_url() {
            local input_url="$1"
            if [[ "$input_url" =~ youtu\.be/([A-Za-z0-9_-]+) ]]; then
              printf 'https://www.youtube.com/watch?v=%s\n' "${BASH_REMATCH[1]}"
            else
              printf '%s\n' "$input_url"
            fi
          }

          random_suffix() {
            printf '%s_%s\n' "$(date +%s%N)" "$RANDOM"
          }

          get_unique_folder() {
            local base_path="$1"
            local name="$2"
            local candidate="$name"

            while [ -d "$base_path/$candidate" ] || [ -d "$BACKUP_DIR/$candidate" ]; do
              candidate="${name}_$(random_suffix)"
            done

            printf '%s\n' "$candidate"
          }

          write_readme() {
            local folder="$1"
            local title="$2"
            local url="$3"
            local quality="$4"
            local passworded="$5"
            local total_size_mb="$6"
            local links_file="$7"
            local main_zip="$8"
            local archive_mode="$9"
            local readme="$folder/README.md"

            {
              printf '# %s\n\n' "$title"

              if [ -f "$folder/thumbnail.jpg" ]; then
                printf '<div align="center">\n  <img src="thumbnail.jpg" width="250" />\n</div>\n\n'
              fi

              printf '%s\n\n' '---'
              printf '## Video Information\n\n'
              printf '| Property | Value |\n|---|---|\n'
              printf '| **Video Name** | `%s` |\n' "$title"
              printf '| **Original Link** | [YouTube Video](%s) |\n' "$url"
              printf '| **Total Size** | **%s MB** |\n' "$total_size_mb"
              printf '| **Quality** | **%s** |\n' "$quality"
              printf '| **Status** | **Complete (100%%)** |\n'
              printf '| **Password Protected** | **%s** |\n\n' "$passworded"

              printf '%s\n\n' '---'
              printf '## Download Links\n\n'

              if [ "$archive_mode" = "split" ]; then
                printf '> ⬇️ Download **all parts**, then open `%s` — the other parts are found automatically.\n\n' "$main_zip"
                printf '| # | File | Link |\n|---|---|---|\n'
                cat "$links_file"
              else
                printf '| # | File | Link |\n|---|---|---|\n'
                cat "$links_file"
              fi

              printf '\n---\n\n'
              printf '*This tool was created by OurtubeCracked*\n'
            } > "$readme"
          }

          URL_INDEX=0
          for raw_url in "${URL_LIST[@]}"; do
            URL_INDEX=$((URL_INDEX + 1))
            URL=$(normalize_youtube_url "$raw_url")
            TMP_DIR="tmp_downloads_${URL_INDEX}"
            mkdir -p "$TMP_DIR"

            echo "============================================================"
            echo "Processing URL $URL_INDEX / $TOTAL_URLS : $URL"
            echo "============================================================"

            DOWNLOAD_SUCCESS=false
            for METHOD in 1 2 3 4 5 6 7 8; do
              if download_video "$METHOD" "$URL" "$TMP_DIR" && verify_download_quality "$TMP_DIR" "$QUALITY"; then
                echo "✅ Download successful with method $METHOD"
                DOWNLOAD_SUCCESS=true
                break
              fi
              echo "⚠️ Method $METHOD failed or produced invalid quality; retrying..."
              cleanup_download_dir "$TMP_DIR"
              sleep 3
            done

            if [ "$DOWNLOAD_SUCCESS" != true ]; then
              echo "❌ All download methods failed for URL: $URL"
              rm -rf "$TMP_DIR"
              continue
            fi

            rm -f "$TMP_DIR"/*.part 2>/dev/null || true

            for FILE in "$TMP_DIR"/*; do
              [ -f "$FILE" ] || continue
              case "$FILE" in
                *.jpg|*.webp) continue ;;
              esac

              SIZE=$(stat -c%s "$FILE")
              BASENAME=$(basename "$FILE")
              TITLE="${BASENAME%.*}"
              EXT="${BASENAME##*.}"
              TITLE=$(sanitize_name "$TITLE")
              FINAL_FOLDER_NAME=$(get_unique_folder videos "$TITLE")
              FINAL_DIR="$BACKUP_DIR/$FINAL_FOLDER_NAME"
              mkdir -p "$FINAL_DIR"

              for THUMB_FILE in "$TMP_DIR"/*.jpg; do
                if [ -f "$THUMB_FILE" ]; then
                  cp "$THUMB_FILE" "$FINAL_DIR/thumbnail.jpg"
                  break
                fi
              done

              FOLDER_ENCODED=$(urlencode "$FINAL_FOLDER_NAME")
              LINK_FILE=$(mktemp)

              if [ "$SIZE" -gt "$SPLIT_BYTES" ]; then
                ARCHIVE_BASE="$FINAL_DIR/$FINAL_FOLDER_NAME"
                if [ -n "$ZIP_PASSWORD" ]; then
                  7z a -tzip -v${SPLIT_MB}m -p"$ZIP_PASSWORD" -mx=0 "${ARCHIVE_BASE}.zip" "$FILE" >/dev/null
                else
                  zip -0 -s ${SPLIT_MB}m "${ARCHIVE_BASE}.zip" "$FILE" >/dev/null
                fi

                PART_COUNT=0
                TOTAL_SIZE=0
                for PART in "$FINAL_DIR"/*.zip "$FINAL_DIR"/*.z[0-9]*; do
                  [ -f "$PART" ] || continue
                  PART_COUNT=$((PART_COUNT + 1))
                  TOTAL_SIZE=$((TOTAL_SIZE + $(stat -c%s "$PART")))
                done
                TOTAL_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $TOTAL_SIZE/1024/1024}")

                LINK_NUM=0
                while IFS= read -r PART; do
                  [ -f "$PART" ] || continue
                  PART_BASENAME=$(basename "$PART")
                  PART_ENCODED=$(urlencode "$PART_BASENAME")
                  RAW_LINK="https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/videos/${FOLDER_ENCODED}/${PART_ENCODED}"
                  LINK_NUM=$((LINK_NUM + 1))
                  printf '| %s | `%s` | [Download](%s) |\n' "$LINK_NUM" "$PART_BASENAME" "$RAW_LINK" >> "$LINK_FILE"
                done < <(printf '%s\n' "$FINAL_DIR"/*.zip "$FINAL_DIR"/*.z[0-9]* | awk 'NF' | sort -V)

                write_readme "$FINAL_DIR" "$TITLE" "$URL" "$QUALITY" "$([ -n "$ZIP_PASSWORD" ] && echo YES || echo NO)" "$TOTAL_SIZE_MB" "$LINK_FILE" "${FINAL_FOLDER_NAME}.zip" split
              else
                OUTPUT_NAME="${FINAL_FOLDER_NAME}.${EXT}"
                cp "$FILE" "$FINAL_DIR/$OUTPUT_NAME"
                SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE/1024/1024}")
                FILE_ENCODED=$(urlencode "$OUTPUT_NAME")
                RAW_LINK="https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/videos/${FOLDER_ENCODED}/${FILE_ENCODED}"
                printf '| 1 | `%s` | [Download](%s) |\n' "$OUTPUT_NAME" "$RAW_LINK" > "$LINK_FILE"
                write_readme "$FINAL_DIR" "$TITLE" "$URL" "$QUALITY" "YES" "$SIZE_MB" "$LINK_FILE" "$OUTPUT_NAME" single
              fi

              rm -f "$LINK_FILE"
              echo "${TITLE}|${FINAL_FOLDER_NAME}" >> /tmp/video_info.txt
            done

            rm -rf "$TMP_DIR"
          done

          echo "$BACKUP_DIR" > /tmp/backup_dir_path.txt
          printf 'REPO_OWNER_ENV=%s\n' "$REPO_OWNER_ENV" > /tmp/env_vars.txt
          printf 'REPO_NAME_ENV=%s\n' "$REPO_NAME_ENV" >> /tmp/env_vars.txt
          printf 'BRANCH_ENV=%s\n' "$BRANCH_ENV" >> /tmp/env_vars.txt

      - name: Stop WARP Container
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true

      - name: Incremental Commit & Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          source /tmp/env_vars.txt
          REPO_OWNER=${REPO_OWNER_ENV}
          REPO_NAME=${REPO_NAME_ENV}
          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)

          BACKUP_FILE_COUNT=$(find "$BACKUP_DIR" -type f 2>/dev/null | wc -l)
          if [ "$BACKUP_FILE_COUNT" -eq 0 ]; then
            echo "WARNING: No files in backup directory — all downloads may have failed."
            echo "Ensuring videos/ folder exists in repository with a master README..."

            git fetch origin "$BRANCH"
            git reset --hard origin/"$BRANCH"

            mkdir -p videos

            if [ ! -f "videos/README.md" ]; then
              {
                echo "# DOWNLOADED VIDEOS LIST :"
                echo ""
                echo "----"
                echo ""
                echo "> No videos downloaded yet."
              } > videos/README.md
              git add -f videos/README.md
              if ! git diff --cached --quiet; then
                git commit -m "[OurtubeCracked] Initialize videos folder [skip ci]"
                PUSH_RETRY=0
                while [ $PUSH_RETRY -lt 5 ]; do
                  PUSH_RETRY=$((PUSH_RETRY + 1))
                  if timeout 60 git push origin HEAD:"$BRANCH"; then
                    echo "videos/ folder initialized and pushed."
                    break
                  else
                    echo "Push failed, retry $PUSH_RETRY/5..."
                    sleep 3
                  fi
                done
              else
                echo "videos/README.md already exists, nothing to push."
              fi
            else
              echo "videos/ folder already exists in repository."
            fi

            echo "No video files to push. Exiting."
            exit 0
          fi

          urlencode() {
            python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$1"
          }

          regenerate_master_readme() {
            MASTER_README="videos/README.md"
            { echo "# DOWNLOADED VIDEOS LIST :"; echo ""; echo "----"; echo ""; } > "$MASTER_README"
            NUM=0
            for folder in videos/*/; do
              [ -d "$folder" ] || continue
              FOLDER_NAME=$(basename "$folder")
              [ -f "$folder/README.md" ] || continue
              NUM=$((NUM + 1))
              FOLDER_ENCODED=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$FOLDER_NAME")
              FOLDER_LINK="https://github.com/${REPO_OWNER}/${REPO_NAME}/tree/${BRANCH}/videos/${FOLDER_ENCODED}"
              printf -- "- %s - 🎬 [%s](%s)\n" "$NUM" "$FOLDER_NAME" "$FOLDER_LINK" >> "$MASTER_README"
            done
          }

          git fetch origin "$BRANCH"
          git reset --hard origin/"$BRANCH"
          mkdir -p videos
          cp -r "$BACKUP_DIR"/* videos/

          git add -f videos/
          regenerate_master_readme
          git add -f videos/README.md

          if ! git diff --cached --quiet; then
            git commit -m "[OurtubeCracked] YouTube download [skip ci]"
            PUSH_RETRY=0
            while [ $PUSH_RETRY -lt 10 ]; do
              PUSH_RETRY=$((PUSH_RETRY + 1))
              if timeout 300 git push origin HEAD:"$BRANCH"; then
                echo "Push successful!"
                break
              else
                echo "Push failed, retry $PUSH_RETRY/10..."
                sleep 5
                git fetch origin "$BRANCH"
                git reset --hard origin/"$BRANCH"
                cp -r "$BACKUP_DIR"/* videos/
                git add -f videos/
                regenerate_master_readme
                git add -f videos/README.md
                git diff --cached --quiet || git commit -m "[OurtubeCracked] YouTube download [skip ci]"
              fi
            done
          fi
          echo "=========================================="
          echo "All files pushed successfully!"
          echo "=========================================="
